[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simengine"
version = "0.0.1"
description = "Offline text-based evolution simulator with a deterministic engine and an LLM narrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "textual==8.2.8",
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]