services:
  app:
    build: .
    environment:
      SIM_DB_PATH: /data/sim.db
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sim_data:/data
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  sim_data:
  ollama_models: